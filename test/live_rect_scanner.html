<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Rect Scanner</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: contain; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
         padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.55); }
  button { font-size: 16px; padding: 10px 16px; border-radius: 10px; border: 0; background: #2d7ff9; color: #fff; }
  button:disabled { opacity: 0.4; }
  #shutter { width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 4px solid #2d7ff9; padding: 0; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #status { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; }
  #debug { position: fixed; top: calc(36px + env(safe-area-inset-top)); left: 8px; width: 140px; border: 1px solid #555; display: none; }
  #result { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  #out { max-width: 100%; max-height: 75vh; background: #fff; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div id="status">Tap "Start camera"</div>
<canvas id="debug"></canvas>
<div id="bar">
  <button id="start">Start camera</button>
  <button id="shutter" disabled aria-label="Capture"></button>
  <label>Edge min <input id="edgeMin" type="range" min="20" max="200" value="60"></label>
  <label><input id="dbg" type="checkbox"> Edges</label>
</div>
<div id="result">
  <canvas id="out"></canvas>
  <div><button id="save">Save PNG</button> <button id="back">Back</button></div>
</div>

<script>
'use strict';
// CORE START (pure functions, no DOM)

// 5-tap Gaussian blur [1 4 6 4 1]/16, separable
function blur5(src, dst, tmp, w, h) {
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      const x0 = x > 1 ? x - 2 : 0, x1 = x > 0 ? x - 1 : 0;
      const x3 = x < w - 1 ? x + 1 : w - 1, x4 = x < w - 2 ? x + 2 : w - 1;
      tmp[r + x] = src[r + x0] + 4 * src[r + x1] + 6 * src[r + x] + 4 * src[r + x3] + src[r + x4];
    }
  }
  for (let y = 0; y < h; y++) {
    const y0 = (y > 1 ? y - 2 : 0) * w, y1 = (y > 0 ? y - 1 : 0) * w, y2 = y * w;
    const y3 = (y < h - 1 ? y + 1 : h - 1) * w, y4 = (y < h - 2 ? y + 2 : h - 1) * w;
    for (let x = 0; x < w; x++) {
      dst[y2 + x] = (tmp[y0 + x] + 4 * tmp[y1 + x] + 6 * tmp[y2 + x] + 4 * tmp[y3 + x] + tmp[y4 + x] + 128) >> 8;
    }
  }
}

// Sobel gradient magnitude (L1), range 0..2040
function sobel(s, mag, w, h) {
  mag.fill(0);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = s[i - w - 1], b = s[i - w], c = s[i - w + 1];
      const d = s[i - 1], f = s[i + 1];
      const g = s[i + w - 1], hh = s[i + w], k = s[i + w + 1];
      const gx = (c + 2 * f + k) - (a + 2 * d + g);
      const gy = (g + 2 * hh + k) - (a + 2 * b + c);
      mag[i] = Math.abs(gx) + Math.abs(gy);
    }
  }
}

// Threshold = max(80th percentile, edgeMin)
function binarize(mag, bin, n, edgeMin, hist) {
  hist.fill(0);
  for (let i = 0; i < n; i++) hist[mag[i]]++;
  const target = n * 0.80;
  let c = 0, t = 0;
  for (t = 0; t < hist.length; t++) { c += hist[t]; if (c >= target) break; }
  t = Math.max(t, edgeMin);
  for (let i = 0; i < n; i++) bin[i] = mag[i] > t ? 1 : 0;
  return t;
}

// 3x3 dilation, separable
function dilate(src, dst, tmp, w, h) {
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      tmp[r + x] = src[r + x] | (x > 0 ? src[r + x - 1] : 0) | (x < w - 1 ? src[r + x + 1] : 0);
    }
  }
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      dst[r + x] = tmp[r + x] | (y > 0 ? tmp[r + x - w] : 0) | (y < h - 1 ? tmp[r + x + w] : 0);
    }
  }
}

function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const lower = [], upper = [];
  for (const q of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function polyArea(P) {
  let s = 0;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(s) / 2;
}

// Douglas-Peucker on an open polyline
function dp(pts, eps) {
  if (pts.length < 3) return [pts[0], pts[pts.length - 1]];
  const a = pts[0], b = pts[pts.length - 1];
  const L = dist(a, b) || 1e-9;
  let md = -1, mi = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = Math.abs(cross(a, b, pts[i])) / L;
    if (d > md) { md = d; mi = i; }
  }
  if (md > eps) {
    const r1 = dp(pts.slice(0, mi + 1), eps), r2 = dp(pts.slice(mi), eps);
    return r1.slice(0, -1).concat(r2);
  }
  return [a, b];
}

// Douglas-Peucker on a closed polygon (start at P[0], split at farthest point)
function dpClosed(P, eps) {
  let b = 0, md = -1;
  for (let i = 1; i < P.length; i++) { const d = dist(P[0], P[i]); if (d > md) { md = d; b = i; } }
  const ra = dp(P.slice(0, b + 1), eps);
  const rb = dp(P.slice(b).concat([P[0]]), eps);
  return ra.slice(0, -1).concat(rb.slice(0, -1));
}

function approxQuad(hull) {
  if (hull.length < 4) return null;
  let per = 0;
  for (let i = 0; i < hull.length; i++) per += dist(hull[i], hull[(i + 1) % hull.length]);
  for (let f = 0.01; f <= 0.12; f += 0.01) {
    const r = dpClosed(hull, f * per);
    if (r.length === 4) return refineCorners(hull, r, per);
    if (r.length < 4) return null;
  }
  return null;
}

// Refine corners: for each side, take the longest hull edge in that chain as the side line,
// then intersect adjacent side lines (handles cut or rounded corners)
function refineCorners(hull, q, per) {
  const n = hull.length;
  const idx = q.map(p => hull.indexOf(p));
  if (idx.some(i => i < 0)) return q;
  const lines = [];
  for (let s = 0; s < 4; s++) {
    const a = idx[s], b = idx[(s + 1) % 4];
    let best = -1, bi = a;
    for (let i = a; i !== b; i = (i + 1) % n) {
      const L = dist(hull[i], hull[(i + 1) % n]);
      if (L > best) { best = L; bi = i; }
    }
    lines.push([hull[bi], hull[(bi + 1) % n]]);
  }
  // Shift each side inward by INSET px (edge band is widened by blur + dilation)
  const INSET = 3;
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  for (let s = 0; s < 4; s++) {
    const [p, r] = lines[s];
    const L = dist(p, r) || 1;
    let nx = -(r[1] - p[1]) / L, ny = (r[0] - p[0]) / L;
    if (nx * (cx - p[0]) + ny * (cy - p[1]) < 0) { nx = -nx; ny = -ny; }
    lines[s] = [[p[0] + nx * INSET, p[1] + ny * INSET], [r[0] + nx * INSET, r[1] + ny * INSET]];
  }
  const out = [];
  for (let s = 0; s < 4; s++) {
    const l1 = lines[(s + 3) % 4], l2 = lines[s];
    const p = intersect(l1[0], l1[1], l2[0], l2[1]);
    out.push(p && dist(p, q[s]) < 0.05 * per ? p : q[s]);
  }
  return out;
}

function intersect(p1, p2, p3, p4) {
  const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0]);
  if (Math.abs(d) < 1e-9) return null;
  const a = p1[0] * p2[1] - p1[1] * p2[0], b = p3[0] * p4[1] - p3[1] * p4[0];
  return [(a * (p3[0] - p4[0]) - (p1[0] - p2[0]) * b) / d, (a * (p3[1] - p4[1]) - (p1[1] - p2[1]) * b) / d];
}

function isConvex(q) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const c = cross(q[i], q[(i + 1) % 4], q[(i + 2) % 4]);
    if (c === 0) return false;
    if (sign === 0) sign = Math.sign(c); else if (Math.sign(c) !== sign) return false;
  }
  return true;
}

function anglesOk(q, lo, hi) {
  for (let i = 0; i < 4; i++) {
    const p = q[(i + 3) % 4], c = q[i], n = q[(i + 1) % 4];
    const v1x = p[0] - c[0], v1y = p[1] - c[1], v2x = n[0] - c[0], v2y = n[1] - c[1];
    const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1e-9);
    const ang = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
    if (ang < lo || ang > hi) return false;
  }
  return true;
}

// Order as TL, TR, BR, BL (screen coords, y down)
function orderQuad(q) {
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4;
  const cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  const s = q.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let k = 0;
  for (let i = 1; i < 4; i++) if (s[i][0] + s[i][1] < s[k][0] + s[k][1]) k = i;
  return [s[k], s[(k + 1) % 4], s[(k + 2) % 4], s[(k + 3) % 4]].map(p => [p[0], p[1]]);
}

// Find the largest valid quadrilateral among edge components
function findQuad(bin, w, h, labels, stack) {
  labels.fill(0);
  const minArea = 0.06 * w * h;
  let best = null, lab = 0;
  const n = w * h;
  for (let i0 = 0; i0 < n; i0++) {
    if (!bin[i0] || labels[i0]) continue;
    lab++;
    let sp = 0; stack[sp++] = i0; labels[i0] = lab;
    let minx = w, maxx = 0, miny = h, maxy = 0;
    while (sp > 0) {
      const i = stack[--sp];
      const x = i % w, y = (i / w) | 0;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= w) continue;
          const j = yy * w + xx;
          if (bin[j] && !labels[j]) { labels[j] = lab; stack[sp++] = j; }
        }
      }
    }
    if ((maxx - minx) * (maxy - miny) < minArea) continue;
    // Row extremes are enough for the convex hull
    const pts = [];
    for (let y = miny; y <= maxy; y++) {
      const r = y * w; let l = -1, rr = -1;
      for (let x = minx; x <= maxx; x++) if (labels[r + x] === lab) { if (l < 0) l = x; rr = x; }
      if (l >= 0) { pts.push([l, y]); if (rr !== l) pts.push([rr, y]); }
    }
    const hull = convexHull(pts);
    const ha = polyArea(hull);
    if (ha < minArea) continue;
    const q = approxQuad(hull);
    if (!q) continue;
    const qa = polyArea(q);
    if (qa < minArea || qa / ha < 0.85 || !isConvex(q) || !anglesOk(q, 35, 145)) continue;
    if (!best || qa > best.area) best = { pts: orderQuad(q), area: qa };
  }
  return best;
}

// Homography mapping dst -> src (8 unknowns, Gaussian elimination)
function homography(src, dst) {
  const A = [];
  for (let k = 0; k < 4; k++) {
    const u = dst[k][0], v = dst[k][1], x = src[k][0], y = src[k][1];
    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x, x]);
    A.push([0, 0, 0, u, v, 1, -u * y, -v * y, y]);
  }
  for (let c = 0; c < 8; c++) {
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map((row, i) => row[8] / row[i]);
}

// Perspective warp with bilinear sampling. src: RGBA Uint8ClampedArray
function warpPerspective(src, sw, sh, quad, OW, OH, out) {
  const H = homography(quad, [[0, 0], [OW - 1, 0], [OW - 1, OH - 1], [0, OH - 1]]);
  let o = 0;
  for (let v = 0; v < OH; v++) {
    for (let u = 0; u < OW; u++) {
      const den = H[6] * u + H[7] * v + 1;
      let x = (H[0] * u + H[1] * v + H[2]) / den;
      let y = (H[3] * u + H[4] * v + H[5]) / den;
      if (x < 0) x = 0; if (y < 0) y = 0;
      if (x > sw - 1.001) x = sw - 1.001; if (y > sh - 1.001) y = sh - 1.001;
      const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
      const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4;
      for (let ch = 0; ch < 3; ch++) {
        const top = src[i00 + ch] + (src[i10 + ch] - src[i00 + ch]) * fx;
        const bot = src[i01 + ch] + (src[i11 + ch] - src[i01 + ch]) * fx;
        out[o + ch] = top + (bot - top) * fy;
      }
      out[o + 3] = 255;
      o += 4;
    }
  }
}
// CORE END

// ---------- App ----------
const PROC_W = 320;
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
const statusEl = $('status'), debugCv = $('debug'), dctx = debugCv.getContext('2d');
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently: true });

let W = 0, H = 0, ws = null, vwPrev = 0, vhPrev = 0;
const track = { q: null, hits: 0, miss: 0 };
let fpsT = performance.now(), fpsN = 0, fps = 0;

function alloc(vw, vh) {
  W = PROC_W; H = Math.round(PROC_W * vh / vw);
  proc.width = W; proc.height = H;
  debugCv.width = W; debugCv.height = H;
  const n = W * H;
  ws = {
    gray: new Uint8Array(n), blur: new Uint8Array(n), tmp16: new Uint16Array(n),
    mag: new Uint16Array(n), bin: new Uint8Array(n), bin2: new Uint8Array(n), tmp8: new Uint8Array(n),
    labels: new Int32Array(n), stack: new Int32Array(n), hist: new Uint32Array(2048),
    dbg: new ImageData(W, H)
  };
}

function updateTrack(det) {
  if (det) {
    const p = det.pts;
    if (track.q) {
      let d = 0; for (let k = 0; k < 4; k++) d += dist(p[k], track.q[k]); d /= 4;
      if (d > 0.12 * W) { track.q = p.map(a => a.slice()); track.hits = 1; }
      else {
        for (let k = 0; k < 4; k++) {
          track.q[k][0] += 0.4 * (p[k][0] - track.q[k][0]);
          track.q[k][1] += 0.4 * (p[k][1] - track.q[k][1]);
        }
        track.hits++;
      }
    } else { track.q = p.map(a => a.slice()); track.hits = 1; }
    track.miss = 0;
  } else if (++track.miss > 8) { track.q = null; track.hits = 0; }
}
const trackVisible = () => track.q && track.hits >= 3;

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  if (overlay.width !== Math.round(cw * dpr) || overlay.height !== Math.round(ch * dpr)) {
    overlay.width = Math.round(cw * dpr); overlay.height = Math.round(ch * dpr);
  }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, cw, ch);
  if (!trackVisible()) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.min(cw / vw, ch / vh), ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const k = (vw / W) * s;
  const P = track.q.map(p => [ox + p[0] * k, oy + p[1] * k]);
  octx.beginPath();
  octx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < 4; i++) octx.lineTo(P[i][0], P[i][1]);
  octx.closePath();
  octx.fillStyle = 'rgba(45,127,249,0.18)'; octx.fill();
  octx.lineWidth = 3; octx.strokeStyle = '#2d7ff9'; octx.stroke();
  octx.fillStyle = '#fff';
  for (const p of P) { octx.beginPath(); octx.arc(p[0], p[1], 6, 0, Math.PI * 2); octx.fill(); }
}

function loop() {
  if (video.readyState >= 2 && video.videoWidth) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw !== vwPrev || vh !== vhPrev) { alloc(vw, vh); vwPrev = vw; vhPrev = vh; track.q = null; }
    pctx.drawImage(video, 0, 0, W, H);
    const rgba = pctx.getImageData(0, 0, W, H).data;
    const n = W * H, g = ws.gray;
    for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (rgba[j] * 77 + rgba[j + 1] * 150 + rgba[j + 2] * 29) >> 8;
    blur5(g, ws.blur, ws.tmp16, W, H);
    sobel(ws.blur, ws.mag, W, H);
    binarize(ws.mag, ws.bin, n, +$('edgeMin').value, ws.hist);
    dilate(ws.bin, ws.bin2, ws.tmp8, W, H);
    const det = findQuad(ws.bin2, W, H, ws.labels, ws.stack);
    updateTrack(det);
    drawOverlay();
    if ($('dbg').checked) {
      const d = ws.dbg.data;
      for (let i = 0, j = 0; i < n; i++, j += 4) { const v = ws.bin2[i] ? 255 : 0; d[j] = d[j + 1] = d[j + 2] = v; d[j + 3] = 255; }
      dctx.putImageData(ws.dbg, 0, 0);
    }
    fpsN++;
    const now = performance.now();
    if (now - fpsT > 1000) { fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now; }
    statusEl.textContent = `${fps} fps | ${trackVisible() ? 'detected' : 'searching'}`;
  }
  requestAnimationFrame(loop);
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusEl.textContent = 'Camera API not available (HTTPS required)';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
    $('start').style.display = 'none';
    $('shutter').disabled = false;
    requestAnimationFrame(loop);
  } catch (e) {
    statusEl.textContent = 'Camera error: ' + e.name;
  }
}

function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const full = document.createElement('canvas');
  full.width = vw; full.height = vh;
  const fctx = full.getContext('2d');
  fctx.drawImage(video, 0, 0, vw, vh);
  const out = $('out'), outCtx = out.getContext('2d');
  if (trackVisible()) {
    const k = vw / W;
    const q = track.q.map(p => [p[0] * k, p[1] * k]);
    let OW = Math.max(dist(q[0], q[1]), dist(q[3], q[2]));
    let OH = Math.max(dist(q[0], q[3]), dist(q[1], q[2]));
    const cap = 2400 / Math.max(OW, OH);
    if (cap < 1) { OW *= cap; OH *= cap; }
    OW = Math.round(OW); OH = Math.round(OH);
    const src = fctx.getImageData(0, 0, vw, vh).data;
    out.width = OW; out.height = OH;
    const img = outCtx.createImageData(OW, OH);
    warpPerspective(src, vw, vh, q, OW, OH, img.data);
    outCtx.putImageData(img, 0, 0);
  } else {
    out.width = vw; out.height = vh;
    outCtx.drawImage(full, 0, 0);
  }
  $('result').style.display = 'flex';
}

$('start').onclick = startCamera;
$('shutter').onclick = capture;
$('back').onclick = () => { $('result').style.display = 'none'; };
$('dbg').onchange = e => { debugCv.style.display = e.target.checked ? 'block' : 'none'; };
$('save').onclick = () => {
  $('out').toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'scan_' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
};
</script>
