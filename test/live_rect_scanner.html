<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Rect Scanner</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: contain; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
         padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.55); }
  button { font-size: 16px; padding: 10px 16px; border-radius: 10px; border: 0; background: #2d7ff9; color: #fff; }
  button:disabled { opacity: 0.4; }
  #shutter { width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 4px solid #2d7ff9; padding: 0; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #status { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; }
  #debug { position: fixed; top: calc(36px + env(safe-area-inset-top)); left: 8px; width: 140px; border: 1px solid #555; display: none; }
  #result { position: fixed; inset: 0; background: #111; display: none; flex-direction: column; }
  #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: calc(8px + env(safe-area-inset-top)) 8px 8px; box-sizing: border-box; }
  #out { max-width: 100%; max-height: 100%; background: #fff; }
  #edit { width: 100%; height: 100%; display: none; touch-action: none; }
  #panel { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); background: #1a1a1a; }
  #ratios { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #ratios button { flex: none; font-size: 13px; padding: 7px 11px; background: #333; }
  #ratios button.on, #filters button.on { background: #2d7ff9; }
  #filters { display: flex; gap: 6px; justify-content: center; }
  #filters button { flex: none; font-size: 13px; padding: 7px 14px; background: #333; }
  #ratioInfo { font-size: 11px; color: #aaa; text-align: center; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; font-size: 15px; padding: 10px 6px; }
  .row button.gray { background: #444; }
  select { font-size: 14px; padding: 6px; border-radius: 8px; max-width: 46vw; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div id="status">Tap "Start camera"</div>
<canvas id="debug"></canvas>
<div id="bar">
  <button id="start">Start camera</button>
  <select id="camSel" style="display:none" aria-label="Camera"></select>
  <button id="shutter" disabled aria-label="Capture"></button>
  <label>Edge min <input id="edgeMin" type="range" min="20" max="200" value="60"></label>
  <label><input id="dbg" type="checkbox"> Edges</label>
</div>
<div id="result">
  <div id="view">
    <canvas id="out"></canvas>
    <canvas id="edit"></canvas>
  </div>
  <div id="panel">
    <div id="ratioInfo"></div>
    <div id="ratios"></div>
    <div id="filters"><button id="grayBtn">B/W</button><button id="mmBtn">Min-max</button></div>
    <div class="row" id="reviewRow">
      <button id="editBtn" class="gray">Edit corners</button>
      <button id="save">Save</button>
      <button id="back" class="gray">Retake</button>
    </div>
    <div class="row" id="editRow" style="display:none">
      <button id="resetBtn" class="gray">Reset</button>
      <button id="fullBtn" class="gray">Full frame</button>
      <button id="cancelBtn" class="gray">Cancel</button>
      <button id="doneBtn">Done</button>
    </div>
  </div>
</div>

<script>
'use strict';
// CORE START (pure functions, no DOM)

// 5-tap Gaussian blur [1 4 6 4 1]/16, separable
function blur5(src, dst, tmp, w, h) {
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      const x0 = x > 1 ? x - 2 : 0, x1 = x > 0 ? x - 1 : 0;
      const x3 = x < w - 1 ? x + 1 : w - 1, x4 = x < w - 2 ? x + 2 : w - 1;
      tmp[r + x] = src[r + x0] + 4 * src[r + x1] + 6 * src[r + x] + 4 * src[r + x3] + src[r + x4];
    }
  }
  for (let y = 0; y < h; y++) {
    const y0 = (y > 1 ? y - 2 : 0) * w, y1 = (y > 0 ? y - 1 : 0) * w, y2 = y * w;
    const y3 = (y < h - 1 ? y + 1 : h - 1) * w, y4 = (y < h - 2 ? y + 2 : h - 1) * w;
    for (let x = 0; x < w; x++) {
      dst[y2 + x] = (tmp[y0 + x] + 4 * tmp[y1 + x] + 6 * tmp[y2 + x] + 4 * tmp[y3 + x] + tmp[y4 + x] + 128) >> 8;
    }
  }
}

// Sobel gradient magnitude (L1), range 0..2040
function sobel(s, mag, w, h) {
  mag.fill(0);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = s[i - w - 1], b = s[i - w], c = s[i - w + 1];
      const d = s[i - 1], f = s[i + 1];
      const g = s[i + w - 1], hh = s[i + w], k = s[i + w + 1];
      const gx = (c + 2 * f + k) - (a + 2 * d + g);
      const gy = (g + 2 * hh + k) - (a + 2 * b + c);
      mag[i] = Math.abs(gx) + Math.abs(gy);
    }
  }
}

// Threshold = max(80th percentile, edgeMin)
function binarize(mag, bin, n, edgeMin, hist) {
  hist.fill(0);
  for (let i = 0; i < n; i++) hist[mag[i]]++;
  const target = n * 0.80;
  let c = 0, t = 0;
  for (t = 0; t < hist.length; t++) { c += hist[t]; if (c >= target) break; }
  t = Math.max(t, edgeMin);
  for (let i = 0; i < n; i++) bin[i] = mag[i] > t ? 1 : 0;
  return t;
}

// 3x3 dilation, separable
function dilate(src, dst, tmp, w, h) {
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      tmp[r + x] = src[r + x] | (x > 0 ? src[r + x - 1] : 0) | (x < w - 1 ? src[r + x + 1] : 0);
    }
  }
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      dst[r + x] = tmp[r + x] | (y > 0 ? tmp[r + x - w] : 0) | (y < h - 1 ? tmp[r + x + w] : 0);
    }
  }
}

function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

function convexHull(pts) {
  if (pts.length < 3) return pts.slice();
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const lower = [], upper = [];
  for (const q of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

function polyArea(P) {
  let s = 0;
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(s) / 2;
}

// Douglas-Peucker on an open polyline
function dp(pts, eps) {
  if (pts.length < 3) return [pts[0], pts[pts.length - 1]];
  const a = pts[0], b = pts[pts.length - 1];
  const L = dist(a, b) || 1e-9;
  let md = -1, mi = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = Math.abs(cross(a, b, pts[i])) / L;
    if (d > md) { md = d; mi = i; }
  }
  if (md > eps) {
    const r1 = dp(pts.slice(0, mi + 1), eps), r2 = dp(pts.slice(mi), eps);
    return r1.slice(0, -1).concat(r2);
  }
  return [a, b];
}

// Douglas-Peucker on a closed polygon (start at P[0], split at farthest point)
function dpClosed(P, eps) {
  let b = 0, md = -1;
  for (let i = 1; i < P.length; i++) { const d = dist(P[0], P[i]); if (d > md) { md = d; b = i; } }
  const ra = dp(P.slice(0, b + 1), eps);
  const rb = dp(P.slice(b).concat([P[0]]), eps);
  return ra.slice(0, -1).concat(rb.slice(0, -1));
}

function approxQuad(hull) {
  if (hull.length < 4) return null;
  let per = 0;
  for (let i = 0; i < hull.length; i++) per += dist(hull[i], hull[(i + 1) % hull.length]);
  for (let f = 0.01; f <= 0.12; f += 0.01) {
    const r = dpClosed(hull, f * per);
    if (r.length === 4) return refineCorners(hull, r, per);
    if (r.length < 4) return null;
  }
  return null;
}

// Refine corners: for each side, take the longest hull edge in that chain as the side line,
// then intersect adjacent side lines (handles cut or rounded corners)
function refineCorners(hull, q, per) {
  const n = hull.length;
  const idx = q.map(p => hull.indexOf(p));
  if (idx.some(i => i < 0)) return q;
  const lines = [];
  for (let s = 0; s < 4; s++) {
    const a = idx[s], b = idx[(s + 1) % 4];
    let best = -1, bi = a;
    for (let i = a; i !== b; i = (i + 1) % n) {
      const L = dist(hull[i], hull[(i + 1) % n]);
      if (L > best) { best = L; bi = i; }
    }
    lines.push([hull[bi], hull[(bi + 1) % n]]);
  }
  // Shift each side inward by INSET px (edge band is widened by blur + dilation)
  const INSET = 3;
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  for (let s = 0; s < 4; s++) {
    const [p, r] = lines[s];
    const L = dist(p, r) || 1;
    let nx = -(r[1] - p[1]) / L, ny = (r[0] - p[0]) / L;
    if (nx * (cx - p[0]) + ny * (cy - p[1]) < 0) { nx = -nx; ny = -ny; }
    lines[s] = [[p[0] + nx * INSET, p[1] + ny * INSET], [r[0] + nx * INSET, r[1] + ny * INSET]];
  }
  const out = [];
  for (let s = 0; s < 4; s++) {
    const l1 = lines[(s + 3) % 4], l2 = lines[s];
    const p = intersect(l1[0], l1[1], l2[0], l2[1]);
    out.push(p && dist(p, q[s]) < 0.05 * per ? p : q[s]);
  }
  return out;
}

function intersect(p1, p2, p3, p4) {
  const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0]);
  if (Math.abs(d) < 1e-9) return null;
  const a = p1[0] * p2[1] - p1[1] * p2[0], b = p3[0] * p4[1] - p3[1] * p4[0];
  return [(a * (p3[0] - p4[0]) - (p1[0] - p2[0]) * b) / d, (a * (p3[1] - p4[1]) - (p1[1] - p2[1]) * b) / d];
}

function isConvex(q) {
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const c = cross(q[i], q[(i + 1) % 4], q[(i + 2) % 4]);
    if (c === 0) return false;
    if (sign === 0) sign = Math.sign(c); else if (Math.sign(c) !== sign) return false;
  }
  return true;
}

function anglesOk(q, lo, hi) {
  for (let i = 0; i < 4; i++) {
    const p = q[(i + 3) % 4], c = q[i], n = q[(i + 1) % 4];
    const v1x = p[0] - c[0], v1y = p[1] - c[1], v2x = n[0] - c[0], v2y = n[1] - c[1];
    const cos = (v1x * v2x + v1y * v2y) / (Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y) || 1e-9);
    const ang = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
    if (ang < lo || ang > hi) return false;
  }
  return true;
}

// Order as TL, TR, BR, BL (screen coords, y down)
function orderQuad(q) {
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4;
  const cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  const s = q.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  let k = 0;
  for (let i = 1; i < 4; i++) if (s[i][0] + s[i][1] < s[k][0] + s[k][1]) k = i;
  return [s[k], s[(k + 1) % 4], s[(k + 2) % 4], s[(k + 3) % 4]].map(p => [p[0], p[1]]);
}

// Quad candidates from edge components (convex hull + polygon approximation)
function contourCandidates(bin, w, h, labels, stack) {
  labels.fill(0);
  const minArea = 0.06 * w * h;
  const out = [];
  let lab = 0;
  const n = w * h;
  for (let i0 = 0; i0 < n; i0++) {
    if (!bin[i0] || labels[i0]) continue;
    lab++;
    let sp = 0; stack[sp++] = i0; labels[i0] = lab;
    let minx = w, maxx = 0, miny = h, maxy = 0;
    while (sp > 0) {
      const i = stack[--sp];
      const x = i % w, y = (i / w) | 0;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= w) continue;
          const j = yy * w + xx;
          if (bin[j] && !labels[j]) { labels[j] = lab; stack[sp++] = j; }
        }
      }
    }
    if ((maxx - minx) * (maxy - miny) < minArea) continue;
    const pts = [];
    for (let y = miny; y <= maxy; y++) {
      const r = y * w; let l = -1, rr = -1;
      for (let x = minx; x <= maxx; x++) if (labels[r + x] === lab) { if (l < 0) l = x; rr = x; }
      if (l >= 0) { pts.push([l, y]); if (rr !== l) pts.push([rr, y]); }
    }
    const hull = convexHull(pts);
    const ha = polyArea(hull);
    if (ha < minArea) continue;
    const q = approxQuad(hull);
    if (!q) continue;
    if (polyArea(q) / ha < 0.85) continue;
    out.push(q);
  }
  return out;
}

// Sobel with gradient components (needed for edge orientation)
function sobelXY(s, gx, gy, mag, gn, w, h) {
  gx.fill(0); gy.fill(0); mag.fill(0); gn.fill(1);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = s[i - w - 1], b = s[i - w], c = s[i - w + 1];
      const d = s[i - 1], f = s[i + 1];
      const g = s[i + w - 1], hh = s[i + w], k = s[i + w + 1];
      const X = (c + 2 * f + k) - (a + 2 * d + g);
      const Y = (g + 2 * hh + k) - (a + 2 * b + c);
      gx[i] = X; gy[i] = Y; mag[i] = (X < 0 ? -X : X) + (Y < 0 ? -Y : Y);
      gn[i] = Math.sqrt(X * X + Y * Y) || 1;
    }
  }
}

// Non-maximum suppression: thin (1 px) edges at the gradient peak
function nms(mag, gx, gy, t, thin, w, h) {
  thin.fill(0);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x, m = mag[i];
      if (m <= t) continue;
      const ax = Math.abs(gx[i]), ay = Math.abs(gy[i]);
      let a, b;
      if (ay * 2.414 < ax) { a = mag[i - 1]; b = mag[i + 1]; }
      else if (ax * 2.414 < ay) { a = mag[i - w]; b = mag[i + w]; }
      else if ((gx[i] > 0) === (gy[i] > 0)) { a = mag[i - w - 1]; b = mag[i + w + 1]; }
      else { a = mag[i - w + 1]; b = mag[i + w - 1]; }
      if (m >= a && m > b) thin[i] = 1;
    }
  }
}

const NT = 180, COS_T = new Float32Array(NT), SIN_T = new Float32Array(NT);
for (let t = 0; t < NT; t++) { COS_T[t] = Math.cos(t * Math.PI / NT); SIN_T[t] = Math.sin(t * Math.PI / NT); }

// Gradient-guided Hough transform: each edge pixel votes near its own normal angle, weighted by strength squared
function houghLines(thin, gx, gy, mag, w, h, acc, K) {
  const ro = w, NR = acc.length / NT;
  acc.fill(0);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (!thin[i]) continue;
      let th = Math.atan2(gy[i], gx[i]); if (th < 0) th += Math.PI;
      const tb = Math.round(th * NT / Math.PI) % NT;
      const wv = mag[i] * mag[i];   // squared: short strong borders beat long faint texture lines
      for (let d = -2; d <= 2; d++) {
        const t = (tb + d + NT) % NT;
        const r = Math.round(x * COS_T[t] + y * SIN_T[t]) + ro;
        if (r >= 0 && r < NR) acc[t * NR + r] += wv;
      }
    }
  }
  let mx = 0;
  for (let i = 0; i < acc.length; i++) if (acc[i] > mx) mx = acc[i];
  if (mx <= 0) return [];
  const thr = 0.06 * mx, cand = [];
  for (let t = 0; t < NT; t++) {
    for (let r = 1; r < NR - 1; r++) {
      const v = acc[t * NR + r];
      if (v < thr) continue;
      let isMax = true;
      for (let dt = -1; dt <= 1 && isMax; dt++) {
        const tt = (t + dt + NT) % NT;
        for (let dr = -1; dr <= 1; dr++) { if ((dt || dr) && acc[tt * NR + r + dr] > v) { isMax = false; break; } }
      }
      if (isMax) cand.push([v, t, r - ro]);
    }
  }
  cand.sort((p, q) => q[0] - p[0]);
  const lines = [], perBucket = new Uint8Array(18);
  for (const [v, t, r] of cand) {
    const bk = Math.floor(((t + 5) % NT) / 10);
    if (perBucket[bk] >= 8) continue;   // keep orientation diversity (text lines must not crowd out edges)
    let dup = false;
    for (const L of lines) {
      let dt = Math.abs(t - L.t), rr = r;
      if (dt > NT / 2) { dt = NT - dt; rr = -r; }
      if (dt <= 5 && Math.abs(rr - L.r) <= 8) { dup = true; break; }
    }
    if (dup) continue;
    lines.push({ t, r, c: COS_T[t], s: SIN_T[t], v });
    perBucket[bk]++;
    if (lines.length >= K) break;
  }
  return lines;
}

function lineX(a, b) {
  const d = a.c * b.s - a.s * b.c;
  if (Math.abs(d) < 1e-6) return null;
  return [(a.r * b.s - a.s * b.r) / d, (a.c * b.r - a.r * b.c) / d];
}

// Combine two roughly opposite line pairs into quads
function houghCandidates(lines, w, h, limit) {
  const out = [], pairs = [], minDim = Math.min(w, h), cx = w / 2, cy = h / 2;
  const ang = (a, b) => { let d = Math.abs(a.t - b.t); if (d > NT / 2) d = NT - d; return d; };   // degrees, 0..90
  for (let i = 0; i < lines.length; i++) {
    for (let j = i + 1; j < lines.length; j++) {
      const a = lines[i], b = lines[j];
      if (ang(a, b) > 40) continue;
      const da = cx * a.c + cy * a.s - a.r;
      let db = cx * b.c + cy * b.s - b.r;
      if (a.c * b.c + a.s * b.s < 0) db = -db;
      if (Math.abs(da - db) < 0.15 * minDim) continue;
      const mt = Math.atan2(Math.sin(2 * a.t * Math.PI / NT) + Math.sin(2 * b.t * Math.PI / NT),
                            Math.cos(2 * a.t * Math.PI / NT) + Math.cos(2 * b.t * Math.PI / NT)) / 2;
      pairs.push({ a, b, mt });
    }
  }
  const combos = [];
  for (let i = 0; i < pairs.length; i++) {
    for (let j = i + 1; j < pairs.length; j++) {
      const P = pairs[i], Q = pairs[j];
      let d = Math.abs(P.mt - Q.mt) * 180 / Math.PI; if (d > 90) d = 180 - d;
      if (d < 30) continue;
      if (P.a === Q.a || P.a === Q.b || P.b === Q.a || P.b === Q.b) continue;
      combos.push([P.a.v + P.b.v + Q.a.v + Q.b.v, i, j]);
    }
  }
  combos.sort((x, y) => y[0] - x[0]);   // strongest line sets first
  for (let k = 0; k < combos.length && out.length < limit; k++) {
    const P = pairs[combos[k][1]], Q = pairs[combos[k][2]];
    const q = [lineX(P.a, Q.a), lineX(Q.a, P.b), lineX(P.b, Q.b), lineX(Q.b, P.a)];
    if (q.some(p => !p || p[0] < -2 || p[1] < -2 || p[0] > w + 1 || p[1] > h + 1)) continue;
    out.push(q);
  }
  return out;
}

// Inward unit normal of side P-Q (toward the quad centroid c)
function inwardNormal(P, Q, c) {
  const L = dist(P, Q) || 1;
  let nx = -(Q[1] - P[1]) / L, ny = (Q[0] - P[0]) / L;
  if ((c[0] - P[0]) * nx + (c[1] - P[1]) * ny < 0) { nx = -nx; ny = -ny; }
  return [nx, ny];
}

// Fraction of a segment backed by thin edges with matching orientation AND polarity.
// sgn = +1: inside brighter (gradient points inward), -1: inside darker.
function sideSupport(P, Q, c, sgn, thin, gx, gy, mag, w, h, coarse) {
  const L = dist(P, Q);
  if (L < 1) return { f: 0, e: 0 };
  const [nx, ny] = inwardNormal(P, Q, c);
  const N = coarse ? 12 : Math.max(8, (L / 3) | 0);
  let hit = 0, e = 0;
  for (let k = 0; k < N; k++) {
    const t = (k + 0.5) / N, x = P[0] + (Q[0] - P[0]) * t, y = P[1] + (Q[1] - P[1]) * t;
    for (let o = -3; o <= 3; o++) {
      const xi = Math.round(x + nx * o), yi = Math.round(y + ny * o);
      if (xi < 0 || yi < 0 || xi >= w || yi >= h) continue;
      const i = yi * w + xi;
      if (!thin[i]) continue;
      const g = Math.hypot(gx[i], gy[i]) || 1;
      if (sgn * (gx[i] * nx + gy[i] * ny) / g > 0.87) { hit++; e += mag[i]; break; }
    }
  }
  return { f: hit / N, e: e * L / N };
}

// Fast coarse score: 12 samples per side, both polarities in one pass, no allocations in the loop.
// Returns score * sgn (positive: inside brighter, negative: inside darker), 0 if rejected.
function coarseScore(q, thin, gx, gy, gn, mag, w, h) {
  const area = polyArea(q);
  if (area < 0.06 * w * h || area > 0.98 * w * h || !isConvex(q) || !anglesOk(q, 35, 145)) return 0;
  const cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
  let posOK = true, negOK = true, posE = 0, negE = 0;
  for (let s = 0; s < 4; s++) {
    const P = q[s], Q = q[(s + 1) % 4];
    const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
    let nx = -dy / L, ny = dx / L;
    if ((cx - P[0]) * nx + (cy - P[1]) * ny < 0) { nx = -nx; ny = -ny; }
    let ph = 0, nh = 0, pe = 0, ne = 0;
    for (let k = 0; k < 12; k++) {
      // early exit: neither polarity can still reach 5 hits on this side
      const left = 12 - k;
      if ((!posOK || ph + left < 5) && (!negOK || nh + left < 5)) return 0;
      const t = (k + 0.5) / 12, x = P[0] + dx * t, y = P[1] + dy * t;
      let gotP = false, gotN = false;
      for (let o = -2; o <= 2; o++) {
        const xi = Math.round(x + nx * o), yi = Math.round(y + ny * o);
        if (xi < 0 || yi < 0 || xi >= w || yi >= h) continue;
        const i = yi * w + xi;
        if (!thin[i]) continue;
        const cs = (gx[i] * nx + gy[i] * ny) / gn[i];
        if (!gotP && cs > 0.87) { gotP = true; ph++; pe += mag[i]; }
        else if (!gotN && cs < -0.87) { gotN = true; nh++; ne += mag[i]; }
        if (gotP && gotN) break;
      }
    }
    if (ph < 5) posOK = false;   // 0.35 * 12 = 4.2
    if (nh < 5) negOK = false;
    if (!posOK && !negOK) return 0;
    posE += pe * L / 12; negE += ne * L / 12;
  }
  const P = posOK ? posE : 0, N = negOK ? negE : 0;
  return P >= N ? P : -N;
}

function quadCenter(q) { return [(q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4]; }

// Score = edge energy along the perimeter for the better polarity; every side must be at least half supported
function scoreQuad(q, thin, gx, gy, mag, w, h, coarse, onlySgn, minF0) {
  const area = polyArea(q);
  if (area < 0.06 * w * h || area > 0.98 * w * h || !isConvex(q) || !anglesOk(q, 35, 145)) return { score: 0 };
  const c = quadCenter(q);
  const minF = coarse ? 0.35 : (minF0 || 0.5);
  let best = { score: 0 };
  for (const sgn of (onlySgn ? [onlySgn] : [1, -1])) {
    let score = 0;
    for (let s = 0; s < 4; s++) {
      const r = sideSupport(q[s], q[(s + 1) % 4], c, sgn, thin, gx, gy, mag, w, h, coarse);
      if (r.f < minF) { score = 0; break; }
      score += r.e;   // edge energy along the side: strong document borders beat faint texture lines
    }
    if (score > best.score) best = { score, sgn };
  }
  return best;
}

// Refit each side to the thin edge pixels near it (total least squares), then intersect
function refineQuad(q, sgn, thin, gx, gy, w, h) {
  const L = [], c = quadCenter(q);
  for (let s = 0; s < 4; s++) {
    const P = q[s], Q = q[(s + 1) % 4];
    const len = dist(P, Q), ux = (Q[0] - P[0]) / len, uy = (Q[1] - P[1]) / len;
    const [nx, ny] = inwardNormal(P, Q, c);
    const x0 = Math.max(1, Math.floor(Math.min(P[0], Q[0]) - 4)), x1 = Math.min(w - 2, Math.ceil(Math.max(P[0], Q[0]) + 4));
    const y0 = Math.max(1, Math.floor(Math.min(P[1], Q[1]) - 4)), y1 = Math.min(h - 2, Math.ceil(Math.max(P[1], Q[1]) + 4));
    let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * w + x;
        if (!thin[i]) continue;
        const dx = x - P[0], dy = y - P[1];
        const t = (dx * ux + dy * uy) / len;
        if (t < 0.08 || t > 0.92 || Math.abs(dx * nx + dy * ny) > 3) continue;
        const g = Math.hypot(gx[i], gy[i]) || 1;
        if (sgn * (gx[i] * nx + gy[i] * ny) / g < 0.9) continue;
        n++; sx += x; sy += y; sxx += x * x; sxy += x * y; syy += y * y;
      }
    }
    if (n < 8) { L.push(null); continue; }
    const mx = sx / n, my = sy / n;
    const cxx = sxx / n - mx * mx, cxy = sxy / n - mx * my, cyy = syy / n - my * my;
    const a = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
    L.push({ p: [mx, my], d: [Math.cos(a), Math.sin(a)] });
  }
  const out = [];
  for (let s = 0; s < 4; s++) {
    const A = L[(s + 3) % 4], B = L[s];
    let p = null;
    if (A && B) {
      const den = A.d[0] * B.d[1] - A.d[1] * B.d[0];
      if (Math.abs(den) > 1e-6) {
        const t = ((B.p[0] - A.p[0]) * B.d[1] - (B.p[1] - A.p[1]) * B.d[0]) / den;
        p = [A.p[0] + A.d[0] * t, A.p[1] + A.d[1] * t];
      }
    }
    out.push(p && dist(p, q[s]) < 8 ? p : q[s]);
  }
  return isConvex(out) ? out : q;
}

function otsu(hist, n) {
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sB = 0, wB = 0, best = 0, t = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sB += i * hist[i];
    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; t = i; }
  }
  return t;
}

function erode(src, dst, tmp, w, h) {
  for (let y = 0; y < h; y++) { const r = y * w;
    for (let x = 0; x < w; x++) tmp[r + x] = src[r + x] & (x > 0 ? src[r + x - 1] : 0) & (x < w - 1 ? src[r + x + 1] : 0); }
  for (let y = 0; y < h; y++) { const r = y * w;
    for (let x = 0; x < w; x++) dst[r + x] = tmp[r + x] & (y > 0 ? tmp[r + x - w] : 0) & (y < h - 1 ? tmp[r + x + w] : 0); }
}

// Quad candidates from brightness blobs: Otsu split, then both the bright and the dark class
// (white or pastel paper on a darker desk, or a dark card on a light desk). Opening removes thin bits.
function regionCandidates(blur, ws, w, h) {
  const n = w * h, hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) hist[blur[i]]++;
  const t = otsu(hist, n);
  const m = ws.mask, m2 = ws.mask2, out = [];
  for (const bright of [true, false]) {
    for (let i = 0; i < n; i++) m[i] = (blur[i] > t) === bright ? 1 : 0;
    dilate(m, m2, ws.tmp8, w, h); dilate(m2, m, ws.tmp8, w, h);   // closing: fill text holes and lines
    erode(m, m2, ws.tmp8, w, h); erode(m2, m, ws.tmp8, w, h);
    erode(m, m2, ws.tmp8, w, h); erode(m2, m, ws.tmp8, w, h);     // opening: drop thin bits, cut weak bridges
    dilate(m, m2, ws.tmp8, w, h); dilate(m2, m, ws.tmp8, w, h);
    for (const q of contourCandidates(m, w, h, ws.labels, ws.stack)) out.push({ q, sgn: bright ? 1 : -1 });
  }
  return out;
}

function inQuad(q, x, y) {
  let sg = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4];
    const c = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
    if (c !== 0) { const s = c > 0 ? 1 : -1; if (sg === 0) sg = s; else if (s !== sg) return false; }
  }
  return true;
}

// Local contrast across each side: mean brightness 4-8 px inside minus 4-8 px outside.
// A real border separates object from background; a text line just inside the paper has paper on both sides.
// Returns the weakest side (times sgn later), so all four sides must separate.
function sideContrast(q, blur, w, h) {
  const c = quadCenter(q);
  let weakest = Infinity, weakestNeg = Infinity;
  for (let s = 0; s < 4; s++) {
    const P = q[s], Q = q[(s + 1) % 4];
    const [nx, ny] = inwardNormal(P, Q, c);
    let si = 0, ni = 0, so = 0, no = 0;
    for (let k = 0; k < 20; k++) {
      const t = 0.1 + 0.8 * k / 19, x = P[0] + (Q[0] - P[0]) * t, y = P[1] + (Q[1] - P[1]) * t;
      for (const d of [4, 6, 8]) {
        const xi = Math.round(x + nx * d), yi = Math.round(y + ny * d);
        if (xi >= 0 && yi >= 0 && xi < w && yi < h) { si += blur[yi * w + xi]; ni++; }
        const xo = Math.round(x - nx * d), yo = Math.round(y - ny * d);
        if (xo >= 0 && yo >= 0 && xo < w && yo < h) { so += blur[yo * w + xo]; no++; }
      }
    }
    if (!ni || no < 6) continue;   // side runs along the frame edge: no outside to compare
    const d = si / ni - so / no;
    weakest = Math.min(weakest, d); weakestNeg = Math.min(weakestNeg, -d);
  }
  return { pos: weakest === Infinity ? 0 : weakest, neg: weakestNeg === Infinity ? 0 : weakestNeg };
}

// Full detection on a blurred grayscale frame. ws holds preallocated buffers.
function detectQuad(blur, w, h, edgeMin, ws) {
  const n = w * h;
  sobelXY(blur, ws.gx, ws.gy, ws.mag, ws.gn, w, h);
  const t = binarize(ws.mag, ws.bin, n, edgeMin, ws.hist);
  dilate(ws.bin, ws.bin2, ws.tmp8, w, h);
  nms(ws.mag, ws.gx, ws.gy, Math.min(t * 0.6, edgeMin * 0.8), ws.thin, w, h);
  const cands = contourCandidates(ws.bin2, w, h, ws.labels, ws.stack);
  const lines = houghLines(ws.thin, ws.gx, ws.gy, ws.mag, w, h, ws.acc, 40);
  // Line-based candidates: evaluate only the strongest ones (sum of line votes) to bound the cost
  for (const q of houghCandidates(lines, w, h, 1200)) cands.push(q);
  const nEdgeCands = cands.length;
  const regionC = regionCandidates(blur, ws, w, h);
  // Coarse score (12 samples per side) for all, full score for the best 15
  const scored = [];
  for (const q of cands) {
    const v = coarseScore(q, ws.thin, ws.gx, ws.gy, ws.gn, ws.mag, w, h);
    if (v !== 0) scored.push({ q, cs: Math.abs(v), sgn: v > 0 ? 1 : -1 });
  }
  scored.sort((p, q) => q.cs - p.cs);
  // Side contrast is cheap: apply it to the top 150 coarse candidates before choosing the finalists
  const regionK = (q, sgn) => {
    const c2 = sideContrast(q, blur, w, h);
    const dc = sgn > 0 ? c2.pos : c2.neg;
    if (dc < 12) return 0;          // no real separation from the background: not a document border
    const k = dc / 25;
    return k * k;                   // squared and uncapped: the best separating quad wins
  };
  const pre = [];
  for (let i = 0; i < Math.min(150, scored.length); i++) {
    const k = regionK(scored[i].q, scored[i].sgn);
    if (k > 0) pre.push({ q: scored[i].q, sgn: scored[i].sgn, minF: 0.5, rank: scored[i].cs * k });
  }
  pre.sort((p, q) => q.rank - p.rank);
  const finalists = pre.slice(0, 30);
  // Region candidates always reach the final round; weaker edges are accepted when the region is clearly separated
  for (const o of regionC) finalists.push({ q: o.q, sgn: o.sgn, minF: 0.3 });
  let best = null, bs = 0, bsg = 1;
  for (const o of finalists) {
    const r = scoreQuad(o.q, ws.thin, ws.gx, ws.gy, ws.mag, w, h, false, o.sgn, o.minF);
    if (!r.score) continue;
    const k = regionK(o.q, r.sgn);
    if (!k || (o.minF < 0.5 && k < 1.44)) continue;   // region-only candidates need contrast >= 30
    const total = r.score * k;
    if (total > bs) { bs = total; best = o.q; bsg = r.sgn; }
  }
  if (!best) return null;
  const r = refineQuad(best, bsg, ws.thin, ws.gx, ws.gy, w, h);
  return { pts: orderQuad(r), score: bs, ncand: cands.length };
}

function allocBuffers(w, h) {
  const n = w * h;
  return {
    gray: new Uint8Array(n), blur: new Uint8Array(n), tmp16: new Uint16Array(n),
    gx: new Int16Array(n), gy: new Int16Array(n), mag: new Uint16Array(n), gn: new Float32Array(n),
    bin: new Uint8Array(n), bin2: new Uint8Array(n), tmp8: new Uint8Array(n), thin: new Uint8Array(n),
    labels: new Int32Array(n), stack: new Int32Array(n), hist: new Uint32Array(2048),
    acc: new Float32Array(NT * (w + Math.ceil(Math.hypot(w, h)) + 2)),
    mask: new Uint8Array(n), mask2: new Uint8Array(n)
  };
}

function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

// Estimate the real width/height ratio of a rectangle seen in perspective.
// quad: TL, TR, BR, BL in pixels (edge TL-TR = "width"). vw, vh: image size.
// upCam: plane normal in camera coords (x right, y down, z forward), from the gyro, or null.
// Pinhole model with principal point at image center and square pixels.
// Focal length f: 1) gyro + vanishing point, 2) two vanishing points (Zhang-He), 3) default.
function estimateRatio(quad, vw, vh, upCam, defaultF) {
  const D = Math.max(vw, vh), u0 = vw / 2, v0 = vh / 2;
  const P = quad.map(p => [(p[0] - u0) / D, (p[1] - v0) / D, 1]);
  const m1 = P[0], m2 = P[1], m4 = P[2], m3 = P[3];
  const k2 = dot3(cross3(m1, m4), m3) / dot3(cross3(m2, m4), m3);
  const k3 = dot3(cross3(m1, m4), m2) / dot3(cross3(m3, m4), m2);
  const n2 = m2.map((v, i) => k2 * v - m1[i]);
  const n3 = m3.map((v, i) => k3 * v - m1[i]);
  const ratioWithF = f => Math.sqrt((n2[0] * n2[0] + n2[1] * n2[1]) / (f * f) + n2[2] * n2[2]) /
                          Math.sqrt((n3[0] * n3[0] + n3[1] * n3[1]) / (f * f) + n3[2] * n3[2]);
  const okF = f => isFinite(f) && f > 0.3 && f < 3;
  // 1) Gyro: the plane's vanishing line is K^-T n, so any finite vanishing point v gives f
  if (upCam && Math.abs(upCam[2]) > 0.2) {
    const vA = cross3(cross3(m1, m2), cross3(m3, m4));
    const vB = cross3(cross3(m1, m3), cross3(m2, m4));
    const fin = v => Math.abs(v[2]) / (Math.hypot(v[0], v[1]) || 1e-12);
    const v = fin(vA) > fin(vB) ? vA : vB;
    if (fin(v) > 0.05) {
      const f = -(upCam[0] * v[0] + upCam[1] * v[1]) / (upCam[2] * v[2]);
      if (okF(f)) return { ratio: ratioWithF(f), f: f * D, method: 'gyro' };
    }
  }
  // 2) Two finite vanishing points
  if (Math.abs(n2[2]) > 0.02 && Math.abs(n3[2]) > 0.02) {
    const f2 = -(n2[0] * n3[0] + n2[1] * n3[1]) / (n2[2] * n3[2]);
    if (f2 > 0 && okF(Math.sqrt(f2))) return { ratio: ratioWithF(Math.sqrt(f2)), f: Math.sqrt(f2) * D, method: 'vanishing points' };
  }
  // 3) Default per lens type (main camera about 26 mm equiv.)
  const f = defaultF || 0.8;
  return { ratio: ratioWithF(f), f: f * D, method: 'default focal' };
}

// World "up" in rear-camera coords from DeviceOrientation beta/gamma (deg) and screen angle (deg)
function deviceUpToCamera(beta, gamma, screenAngle) {
  const b = beta * Math.PI / 180, g = gamma * Math.PI / 180, a = screenAngle * Math.PI / 180;
  const ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b), uz = Math.cos(g) * Math.cos(b);
  const sx = ux * Math.cos(a) - uy * Math.sin(a), sy = ux * Math.sin(a) + uy * Math.cos(a);
  return [sx, -sy, -uz];
}

// Homography mapping dst -> src (8 unknowns, Gaussian elimination)
function homography(src, dst) {
  const A = [];
  for (let k = 0; k < 4; k++) {
    const u = dst[k][0], v = dst[k][1], x = src[k][0], y = src[k][1];
    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x, x]);
    A.push([0, 0, 0, u, v, 1, -u * y, -v * y, y]);
  }
  for (let c = 0; c < 8; c++) {
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map((row, i) => row[8] / row[i]);
}

// Perspective warp with bilinear sampling. src: RGBA Uint8ClampedArray
function warpPerspective(src, sw, sh, quad, OW, OH, out) {
  const H = homography(quad, [[0, 0], [OW - 1, 0], [OW - 1, OH - 1], [0, OH - 1]]);
  let o = 0;
  for (let v = 0; v < OH; v++) {
    for (let u = 0; u < OW; u++) {
      const den = H[6] * u + H[7] * v + 1;
      let x = (H[0] * u + H[1] * v + H[2]) / den;
      let y = (H[3] * u + H[4] * v + H[5]) / den;
      if (x < 0) x = 0; if (y < 0) y = 0;
      if (x > sw - 1.001) x = sw - 1.001; if (y > sh - 1.001) y = sh - 1.001;
      const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
      const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4;
      for (let ch = 0; ch < 3; ch++) {
        const top = src[i00 + ch] + (src[i10 + ch] - src[i00 + ch]) * fx;
        const bot = src[i01 + ch] + (src[i11 + ch] - src[i01 + ch]) * fx;
        out[o + ch] = top + (bot - top) * fy;
      }
      out[o + 3] = 255;
      o += 4;
    }
  }
}

function updateTrack(det) {
  if (det) {
    const p = det.pts;
    if (track.q) {
      let d = 0; for (let k = 0; k < 4; k++) d += dist(p[k], track.q[k]); d /= 4;
      if (d > 0.12 * W) { track.q = p.map(a => a.slice()); track.hits = 1; }
      else {
        for (let k = 0; k < 4; k++) {
          track.q[k][0] += 0.4 * (p[k][0] - track.q[k][0]);
          track.q[k][1] += 0.4 * (p[k][1] - track.q[k][1]);
        }
        track.hits++;
      }
    } else { track.q = p.map(a => a.slice()); track.hits = 1; }
    track.miss = 0;
  } else if (++track.miss > 8) { track.q = null; track.hits = 0; }
}
const trackVisible = () => track.q && track.hits >= 3;

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  if (overlay.width !== Math.round(cw * dpr) || overlay.height !== Math.round(ch * dpr)) {
    overlay.width = Math.round(cw * dpr); overlay.height = Math.round(ch * dpr);
  }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, cw, ch);
  if (!trackVisible()) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.min(cw / vw, ch / vh), ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  const k = (vw / W) * s;
  const P = track.q.map(p => [ox + p[0] * k, oy + p[1] * k]);
  octx.beginPath();
  octx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < 4; i++) octx.lineTo(P[i][0], P[i][1]);
  octx.closePath();
  octx.fillStyle = 'rgba(45,127,249,0.18)'; octx.fill();
  octx.lineWidth = 3; octx.strokeStyle = '#2d7ff9'; octx.stroke();
  octx.fillStyle = '#fff';
  for (const p of P) { octx.beginPath(); octx.arc(p[0], p[1], 6, 0, Math.PI * 2); octx.fill(); }
}

function loop() {
  if (video.readyState >= 2 && video.videoWidth) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw !== vwPrev || vh !== vhPrev) { alloc(vw, vh); vwPrev = vw; vhPrev = vh; track.q = null; }
    pctx.drawImage(video, 0, 0, W, H);
    const rgba = pctx.getImageData(0, 0, W, H).data;
    const n = W * H, g = ws.gray;
    for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (rgba[j] * 77 + rgba[j + 1] * 150 + rgba[j + 2] * 29) >> 8;
    blur5(g, ws.blur, ws.tmp16, W, H);
    const t0 = performance.now();
    if (t0 >= nextDetect) {
      const det = detectQuad(ws.blur, W, H, +$('edgeMin').value, ws);
      updateTrack(det);
      const dt = performance.now() - t0;
      detMs = detMs * 0.8 + dt * 0.2;
      nextDetect = performance.now() + dt;   // at most about 50% duty cycle, video and overlay stay smooth
      detN++;
    }
    drawOverlay();
    if ($('dbg').checked) {
      const d = ws.dbg.data;
      for (let i = 0, j = 0; i < n; i++, j += 4) { const v = ws.thin[i] ? 255 : (ws.bin2[i] ? 70 : 0); d[j] = d[j + 1] = d[j + 2] = v; d[j + 3] = 255; }
      dctx.putImageData(ws.dbg, 0, 0);
    }
    fpsN++;
    const now = performance.now();
    if (now - fpsT > 1000) { fps = Math.round(fpsN * 1000 / (now - fpsT)); dps = Math.round(detN * 1000 / (now - fpsT)); fpsN = 0; detN = 0; fpsT = now; }
    statusEl.textContent = `${fps} fps | detect ${dps}/s, ${Math.round(detMs)} ms | ${trackVisible() ? 'detected' : 'searching'}`;
  }
  requestAnimationFrame(loop);
}

// ---------- Camera selection ----------
let stream = null, loopStarted = false, curLabel = '';
function defaultFocalFor(label) {
  if (/ultra/i.test(label)) return 0.4;      // ultra wide, about 13 mm equiv.
  if (/tele/i.test(label)) return 2.2;       // telephoto, about 77 mm equiv.
  return 0.8;                                // main camera, about 26 mm equiv.
}

async function openCamera(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const video0 = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  if (deviceId) video0.deviceId = { exact: deviceId };
  else video0.facingMode = { ideal: 'environment' };
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: video0 });
  video.srcObject = stream;
  await video.play();
  const tr = stream.getVideoTracks()[0];
  curLabel = tr.label || '';
  track.q = null; track.hits = 0;
  return tr.getSettings ? tr.getSettings().deviceId : undefined;
}

async function fillCameraList(activeId) {
  const sel = $('camSel');
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  sel.innerHTML = '';
  devs.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label || ('Camera ' + (i + 1));
    if (d.deviceId === activeId) o.selected = true;
    sel.appendChild(o);
  });
  sel.style.display = devs.length > 1 ? 'block' : 'none';
}

// ---------- Gyro ----------
let orient = null;
window.addEventListener('deviceorientation', e => {
  if (e.beta !== null && e.gamma !== null) orient = { beta: e.beta, gamma: e.gamma };
});
function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return window.orientation || 0;
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusEl.textContent = 'Camera API not available (HTTPS required)';
    return;
  }
  // iOS 13+: motion permission must be requested inside the tap handler
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) { /* gyro just stays off */ }
  }
  try {
    const id = await openCamera(null);
    await fillCameraList(id);   // labels are only available after permission
    $('start').style.display = 'none';
    $('shutter').disabled = false;
    if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
  } catch (e) {
    statusEl.textContent = 'Camera error: ' + e.name;
  }
}

$('camSel').onchange = async e => {
  try { await openCamera(e.target.value); }
  catch (err) { statusEl.textContent = 'Camera error: ' + err.name; }
};

// ---------- Capture and ratio ----------
const RATIOS = [
  { id: 'auto', label: 'Auto' }, { id: 'raw', label: 'Raw' },
  { id: 'a4', label: 'A4', r: 297 / 210 }, { id: 'letter', label: 'Letter', r: 11 / 8.5 },
  { id: 'legal', label: 'Legal', r: 14 / 8.5 }, { id: 'id1', label: 'ID card', r: 85.60 / 53.98 },
  { id: 'biz', label: 'Biz card', r: 3.5 / 2 }, { id: 'square', label: '1:1', r: 1 }
];
let cap = null;

(function buildRatioButtons() {
  const box = $('ratios');
  for (const R of RATIOS) {
    const b = document.createElement('button');
    b.textContent = R.label; b.dataset.id = R.id;
    b.onclick = () => { cap.mode = R.id; renderResult(); };
    box.appendChild(b);
  }
  const sw = document.createElement('button');
  sw.textContent = 'Swap W/H'; sw.dataset.id = 'swap';
  sw.onclick = () => { cap.swap = !cap.swap; renderResult(); };
  box.appendChild(sw);
})();

function capture() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const full = document.createElement('canvas');
  full.width = vw; full.height = vh;
  const fctx = full.getContext('2d');
  fctx.drawImage(video, 0, 0, vw, vh);
  let upCam = null;
  if (orient) {
    const u = deviceUpToCamera(orient.beta, orient.gamma, screenAngle());
    if (u[2] < -0.5) upCam = u;   // camera points generally downward: document assumed flat on a table
  }
  const detected = trackVisible();
  const k = vw / W;
  const quad = detected ? track.q.map(p => [p[0] * k, p[1] * k]) : insetQuad(vw, vh, 0.1);
  cap = { full, data: fctx.getImageData(0, 0, vw, vh), vw, vh, quad, detectedQuad: quad.map(p => p.slice()),
          detected, upCam, defaultF: defaultFocalFor(curLabel), mode: 'auto', swap: false,
          gyro: orient ? (upCam ? 'used' : 'not facing down') : 'unavailable' };
  cap.est = estimateRatio(quad, vw, vh, upCam, cap.defaultF);
  $('result').style.display = 'flex';
  showReview();
  if (detected) renderResult();
  else enterEdit();   // nothing detected: let the user place the corners
}

// Grayscale and min-max contrast stretch, applied to a copy of the warped image (no re-warp)
function paintOutput() {
  const src = cap.warped;
  const img = new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
  const d = img.data, n = src.width * src.height;
  if (cap.gray) {
    for (let j = 0; j < d.length; j += 4) { const y = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8; d[j] = d[j + 1] = d[j + 2] = y; }
  }
  let mmText = '';
  if (cap.minmax) {
    // Luminance range with 0.5% clipped at each end (one hot pixel would otherwise cancel the stretch).
    // Same gain on R, G, B so colors do not shift.
    const hist = new Uint32Array(256);
    for (let j = 0; j < d.length; j += 4) hist[(d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8]++;
    const clip = n * 0.005;
    let lo = 0, hi = 255, c = 0;
    for (lo = 0; lo < 255; lo++) { c += hist[lo]; if (c > clip) break; }
    c = 0;
    for (hi = 255; hi > 0; hi--) { c += hist[hi]; if (c > clip) break; }
    if (hi - lo >= 1) {
      const g = 255 / (hi - lo);
      for (let j = 0; j < d.length; j += 4) {
        d[j] = (d[j] - lo) * g; d[j + 1] = (d[j + 1] - lo) * g; d[j + 2] = (d[j + 2] - lo) * g;
      }
    }
    mmText = ` | min-max ${lo}-${hi}`;
  }
  const out = $('out');
  out.width = src.width; out.height = src.height;
  out.getContext('2d').putImageData(img, 0, 0);
  const longShort = Math.max(src.width, src.height) / Math.min(src.width, src.height);
  $('ratioInfo').textContent = `${cap.info} | long/short = ${longShort.toFixed(3)} | ${src.width} x ${src.height} px` +
    (cap.gray ? ' | B/W' : '') + mmText + ` | gyro: ${cap.gyro}` +
    (cap.edited ? ' | corners edited' : '') + (curLabel ? ` | ${curLabel}` : '');
  $('grayBtn').classList.toggle('on', !!cap.gray);
  $('mmBtn').classList.toggle('on', !!cap.minmax);
  prepareBlob();
}

// The share sheet must open synchronously inside the tap, so the image file is encoded ahead of time
let blobToken = 0;
function prepareBlob() {
  const my = ++blobToken;
  cap.blob = null;
  $('save').disabled = true;
  $('out').toBlob(b => {
    if (my !== blobToken || !cap) return;
    cap.blob = b;
    $('save').disabled = false;
  }, 'image/jpeg', 0.92);
}

const canShareFiles = (() => {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'])], 't.jpg', { type: 'image/jpeg' })] })); }
  catch (e) { return false; }
})();
$('save').textContent = canShareFiles ? 'Save to Photos' : 'Download';

function downloadFile(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function insetQuad(vw, vh, f) {
  return [[vw * f, vh * f], [vw * (1 - f), vh * f], [vw * (1 - f), vh * (1 - f)], [vw * f, vh * (1 - f)]];
}

function renderResult() {
  const { data, vw, vh, quad, est } = cap;
  const mw = Math.max(dist(quad[0], quad[1]), dist(quad[3], quad[2]));
  const mh = Math.max(dist(quad[0], quad[3]), dist(quad[1], quad[2]));
  let ratio, info;
  if (cap.mode === 'raw') { ratio = mw / mh; info = 'Raw (edge lengths)'; }
  else if (cap.mode === 'auto') { ratio = est.ratio; info = `Auto (${est.method}, f=${Math.round(est.f)} px)`; }
  else {
    const R = RATIOS.find(x => x.id === cap.mode);
    ratio = est.ratio >= 1 ? R.r : 1 / R.r;   // orientation from the Auto estimate
    info = R.label;
  }
  if (cap.swap) ratio = 1 / ratio;
  let OW = Math.max(mw, mh * ratio), OH = OW / ratio;
  const s = 2400 / Math.max(OW, OH);
  if (s < 1) { OW *= s; OH *= s; }
  OW = Math.max(1, Math.round(OW)); OH = Math.max(1, Math.round(OH));
  const out = $('out'), octx2 = out.getContext('2d');
  out.width = OW; out.height = OH;
  const img = octx2.createImageData(OW, OH);
  warpPerspective(data.data, vw, vh, quad, OW, OH, img.data);
  cap.warped = img;
  cap.info = info;
  paintOutput();
  for (const b of $('ratios').children) {
    b.classList.toggle('on', b.dataset.id === cap.mode || (b.dataset.id === 'swap' && cap.swap));
  }
}

// ---------- Corner editing ----------
const editCv = $('edit'), ectx = editCv.getContext('2d');
let editQuad = null, dragIdx = -1, fit = null;

function showReview() {
  $('out').style.display = ''; editCv.style.display = 'none';
  $('reviewRow').style.display = 'flex'; $('editRow').style.display = 'none';
  $('ratios').style.display = 'flex';
  $('filters').style.display = 'flex';
}

function enterEdit() {
  editQuad = cap.quad.map(p => p.slice());
  $('out').style.display = 'none'; editCv.style.display = 'block';
  $('reviewRow').style.display = 'none'; $('editRow').style.display = 'flex';
  $('ratios').style.display = 'none';
  $('filters').style.display = 'none';
  $('ratioInfo').textContent = 'Drag the corners. A magnifier appears while dragging.';
  requestAnimationFrame(drawEdit);
}

function drawEdit() {
  const dpr = window.devicePixelRatio || 1;
  const cw = editCv.clientWidth, ch = editCv.clientHeight;
  if (!cw || !ch) return;
  editCv.width = Math.round(cw * dpr); editCv.height = Math.round(ch * dpr);
  const { vw, vh } = cap;
  const s = Math.min(cw / vw, ch / vh);
  fit = { s, ox: (cw - vw * s) / 2, oy: (ch - vh * s) / 2, cw, ch };
  ectx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ectx.clearRect(0, 0, cw, ch);
  ectx.drawImage(cap.full, fit.ox, fit.oy, vw * s, vh * s);
  const P = editQuad.map(p => [fit.ox + p[0] * s, fit.oy + p[1] * s]);
  // dim outside the quad
  ectx.save();
  ectx.beginPath();
  ectx.rect(fit.ox, fit.oy, vw * s, vh * s);
  ectx.moveTo(P[0][0], P[0][1]); for (let i = 3; i >= 1; i--) ectx.lineTo(P[i][0], P[i][1]); ectx.closePath();
  ectx.fillStyle = 'rgba(0,0,0,0.45)'; ectx.fill('evenodd');
  ectx.restore();
  ectx.beginPath();
  ectx.moveTo(P[0][0], P[0][1]); for (let i = 1; i < 4; i++) ectx.lineTo(P[i][0], P[i][1]); ectx.closePath();
  ectx.lineWidth = 2; ectx.strokeStyle = isConvex(editQuad) ? '#2d7ff9' : '#ff4d4d'; ectx.stroke();
  P.forEach((p, i) => {
    ectx.beginPath(); ectx.arc(p[0], p[1], i === dragIdx ? 16 : 12, 0, Math.PI * 2);
    ectx.fillStyle = 'rgba(255,255,255,0.35)'; ectx.fill();
    ectx.lineWidth = 2; ectx.strokeStyle = '#fff'; ectx.stroke();
  });
  if (dragIdx >= 0) drawLoupe(P[dragIdx], editQuad[dragIdx]);
}

// Magnifier above the finger: 3x of the source image around the dragged corner
function drawLoupe(pd, pi) {
  const R = 60, Z = 3 * fit.s;
  let cx = pd[0], cy = pd[1] - 110;
  if (cy - R < 0) cy = pd[1] + 110;
  cx = Math.max(R + 4, Math.min(fit.cw - R - 4, cx));
  ectx.save();
  ectx.beginPath(); ectx.arc(cx, cy, R, 0, Math.PI * 2); ectx.clip();
  ectx.fillStyle = '#000'; ectx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  ectx.drawImage(cap.full, cx - pi[0] * Z, cy - pi[1] * Z, cap.vw * Z, cap.vh * Z);
  // quad edges inside the loupe
  const L = editQuad.map(p => [cx + (p[0] - pi[0]) * Z, cy + (p[1] - pi[1]) * Z]);
  ectx.beginPath(); ectx.moveTo(L[0][0], L[0][1]); for (let i = 1; i < 4; i++) ectx.lineTo(L[i][0], L[i][1]); ectx.closePath();
  ectx.lineWidth = 1.5; ectx.strokeStyle = '#2d7ff9'; ectx.stroke();
  ectx.restore();
  ectx.beginPath(); ectx.arc(cx, cy, R, 0, Math.PI * 2); ectx.lineWidth = 2; ectx.strokeStyle = '#fff'; ectx.stroke();
  ectx.beginPath(); ectx.moveTo(cx - 10, cy); ectx.lineTo(cx + 10, cy); ectx.moveTo(cx, cy - 10); ectx.lineTo(cx, cy + 10);
  ectx.lineWidth = 1; ectx.strokeStyle = '#ff4d4d'; ectx.stroke();
}

function toImg(e) {
  const r = editCv.getBoundingClientRect();
  const x = (e.clientX - r.left - fit.ox) / fit.s, y = (e.clientY - r.top - fit.oy) / fit.s;
  return [Math.max(0, Math.min(cap.vw - 1, x)), Math.max(0, Math.min(cap.vh - 1, y))];
}
let grabOff = [0, 0];
editCv.addEventListener('pointerdown', e => {
  if (!fit) return;
  const r = editCv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  let best = -1, bd = 44;   // touch radius in CSS px
  editQuad.forEach((p, i) => {
    const d = Math.hypot(fit.ox + p[0] * fit.s - px, fit.oy + p[1] * fit.s - py);
    if (d < bd) { bd = d; best = i; }
  });
  if (best < 0) return;
  dragIdx = best;
  const q = toImg(e);
  grabOff = [editQuad[best][0] - q[0], editQuad[best][1] - q[1]];   // no jump when grabbing off-center
  editCv.setPointerCapture(e.pointerId);
  drawEdit();
});
editCv.addEventListener('pointermove', e => {
  if (dragIdx < 0) return;
  const q = toImg(e);
  editQuad[dragIdx] = [Math.max(0, Math.min(cap.vw - 1, q[0] + grabOff[0])), Math.max(0, Math.min(cap.vh - 1, q[1] + grabOff[1]))];
  drawEdit();
});
const endDrag = () => { if (dragIdx >= 0) { dragIdx = -1; drawEdit(); } };
editCv.addEventListener('pointerup', endDrag);
editCv.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { if (editCv.style.display === 'block') drawEdit(); });

$('editBtn').onclick = enterEdit;
$('grayBtn').onclick = () => { cap.gray = !cap.gray; paintOutput(); };
$('mmBtn').onclick = () => { cap.minmax = !cap.minmax; paintOutput(); };
$('resetBtn').onclick = () => { editQuad = cap.detectedQuad.map(p => p.slice()); drawEdit(); };
$('fullBtn').onclick = () => { editQuad = insetQuad(cap.vw, cap.vh, 0); drawEdit(); };
$('cancelBtn').onclick = () => { showReview(); renderResult(); };
$('doneBtn').onclick = () => {
  if (!isConvex(editQuad)) { $('ratioInfo').textContent = 'Corners cross each other. Fix the red outline first.'; return; }
  cap.quad = orderQuad(editQuad);
  cap.edited = true;
  cap.est = estimateRatio(cap.quad, cap.vw, cap.vh, cap.upCam, cap.defaultF);
  showReview(); renderResult();
};

$('start').onclick = startCamera;
$('shutter').onclick = capture;
$('back').onclick = () => { $('result').style.display = 'none'; cap = null; };
$('dbg').onchange = e => { debugCv.style.display = e.target.checked ? 'block' : 'none'; };
$('save').onclick = () => {
  if (!cap || !cap.blob) return;
  const name = 'scan_' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.jpg';
  const file = new File([cap.blob], name, { type: 'image/jpeg' });
  if (canShareFiles && navigator.canShare({ files: [file] })) {
    // iOS: share sheet -> "Save Image" puts it in Photos. Android: pick Photos/Gallery or Files.
    navigator.share({ files: [file] }).catch(e => { if (e.name !== 'AbortError') downloadFile(file); });
  } else {
    downloadFile(file);
  }
};
</script>
</body>
</html>
